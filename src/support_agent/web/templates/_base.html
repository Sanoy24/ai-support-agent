<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ store_name }}{% endblock %}</title>
  <style>
    :root { --ink: #1d2a23; --muted: #5d6b63; --line: #dfe5e1; --bg: #f6f8f6; --accent: #2f6b4f; --warn: #a1561c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    a { color: var(--accent); }
    header.bar { background: #fff; border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    header.bar strong { font-size: 17px; }
    main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; }
    .muted { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 13px; color: var(--muted); font-weight: 600; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: #e8f0eb; color: var(--accent); }
    .pill.warn { background: #f6e9de; color: var(--warn); }
    button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
