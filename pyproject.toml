[project]
name = "ai-support-agent"
version = "0.1.0"
description = "AI customer support agent for online stores: answers order, shipping, returns and product questions from real store data, with human handoff."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yonas Mekonnen" }]
requires-python = ">=3.12"
keywords = ["ai-agent", "customer-support", "chatbot", "rag", "shopify", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "sqlalchemy>=2.0.36",
  "numpy>=2.0",
]

[project.scripts]
support-agent = "support_agent.__main__:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
local-embeddings = ["fastembed>=0.4"]

[project.urls]
Repository = "https://github.com/Sanoy24/ai-support-agent"
Issues = "https://github.com/Sanoy24/ai-support-agent/issues"
Changelog = "https://github.com/Sanoy24/ai-support-agent/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]
# The built frontend is gitignored but must ship inside the package.
artifacts = ["src/support_agent/web/dist/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "N", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
